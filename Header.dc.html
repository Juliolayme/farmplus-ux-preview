<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>FarmPlus – Header &amp; menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./site.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="fp" style="font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; color: #2F3A32; background: transparent; overflow: visible">
<div class="progress" aria-hidden="true"></div>
<header class="{{hdrClass}}">
  <div class="wrap hdr-in">
    <a href="{{L.home}}" class="logo" aria-label="FarmPlus – trang chủ">
      <img src="img/ec4ac5435c34ce62b5fec2d83397e33e.png" alt="" width="52" height="52">
      <span><span class="logo-word">Farm<b>Plus</b></span></span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" class="{{n.cls}}" aria-current="{{n.cur}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <div class="hdr-act">
      <div class="lang" role="group" aria-label="Ngôn ngữ">
        <button type="button" aria-pressed="{{langVi}}" onClick="{{setVi}}">VN</button>
        <button type="button" aria-pressed="{{langEn}}" onClick="{{setEn}}">EN</button>
      </div>
      <button type="button" class="burger" aria-label="Mở menu" aria-expanded="{{menuOpenStr}}" onClick="{{openMenu}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    </div>
  </div>
</header>
<div class="{{drawerClass}}" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="{{drawerHidden}}">
  <div class="drawer-top">
    <span class="logo"><img src="img/ec4ac5435c34ce62b5fec2d83397e33e.png" alt="" width="44" height="44"><span class="logo-word">Farm<b>Plus</b></span></span>
    <button type="button" class="close" aria-label="Đóng menu" onClick="{{closeMenu}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </div>
  <nav class="drawer-nav" aria-label="Điều hướng di động">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
      <a href="{{n.href}}" onClick="{{closeMenu}}">{{n.label}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
    </sc-for>
  </nav>
  <div class="drawer-foot">
    <div class="lang" role="group" aria-label="Ngôn ngữ" style="align-self: flex-start">
      <button type="button" aria-pressed="{{langVi}}" onClick="{{setVi}}">VN</button>
      <button type="button" aria-pressed="{{langEn}}" onClick="{{setEn}}">EN</button>
    </div>
    <a href="{{L.contact}}" class="btn btn--solid"><span>Liên hệ hợp tác</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <p class="meta">Hotline: <a href="tel:0989799429">0989 799 429</a><br>farmplusgroup@gmail.com</p>
  </div>
</div>
<div class="fab">
  <a href="https://zalo.me/0989799429" class="fab-zalo" aria-label="Chat Zalo với FarmPlus">Zalo<span class="fab-label" aria-hidden="true">Chat Zalo</span></a>
  <a href="tel:0989799429" class="fab-call" aria-label="Gọi ngay 0989 799 429"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg><span class="fab-label" aria-hidden="true">Gọi ngay 0989 799 429</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","about","products","feed","news","careers","contact"],"default":"home"},"m":{"editor":"boolean","default":false},"drawerOpen":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":84}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._onScroll = () => {
      const s = (window.scrollY || document.documentElement.scrollTop || 0) > 10;
      if (s !== !!(this.state && this.state.scrolled)) this.setState({ scrolled: s });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); }
  renderVals() {
    const st = this.state || {};
    const m = !!this.props.m;
    const f = (n) => ({Main:'index.html',About:'gioi-thieu.html',Products:'san-pham.html',ProductDetail:'san-pham-chi-tiet.html',Feed:'thuc-an.html',FeedDetail:'thuc-an-chi-tiet.html',News:'tin-tuc.html',NewsDetail:'tin-tuc-chi-tiet.html',Careers:'tuyen-dung.html',CareerDetail:'tuyen-dung-chi-tiet.html',Contact:'lien-he.html',Privacy:'chinh-sach-bao-mat.html',Terms:'dieu-khoan-su-dung.html'})[n];
    const L = { home: './', about: f('About'), products: f('Products'), feed: f('Feed'), news: f('News'), careers: f('Careers'), contact: f('Contact') };
    const cur = this.props.current || 'home';
    const nav = [['about', 'Giới thiệu'], ['products', 'Sản phẩm'], ['feed', 'Thức ăn chăn nuôi'], ['news', 'Tin tức'], ['careers', 'Tuyển dụng'], ['contact', 'Liên hệ']]
      .map(([k, label]) => ({ href: L[k], label, cls: k === cur ? 'is-cur' : '', cur: k === cur ? 'page' : 'false' }));
    const menuOpen = st.menuOpen != null ? st.menuOpen : !!this.props.drawerOpen;
    const lang = st.lang || 'vi';
    return {
      L, nav,
      hdrClass: 'hdr' + (st.scrolled ? ' is-scrolled' : ''),
      drawerClass: 'drawer' + (menuOpen ? ' is-open' : ''),
      drawerHidden: menuOpen ? 'false' : 'true',
      menuOpenStr: menuOpen ? 'true' : 'false',
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
      langVi: lang === 'vi' ? 'true' : 'false',
      langEn: lang === 'en' ? 'true' : 'false',
      setVi: () => this.setState({ lang: 'vi' }),
      setEn: () => this.setState({ lang: 'en' })
    };
  }
}
</script>
</body>
</html>
